<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Code-Drawn Motion Graphics Engine & Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=block">
<style>
  :root {
    color-scheme: dark;
    --bg: #09090b;
    --panel: #141417;
    --line: #27272a;
    --ink: #f4f4f5;
    --dim: #a1a1aa;
    --accent: #ffd60a;
    --blue: #38bdf8;
    --display: "Anton", sans-serif;
    --body: "Inter", system-ui, sans-serif;
    --serif: "Instrument Serif", Georgia, serif;
    --mono: "JetBrains Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--body);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; overflow: hidden;
  }
  .wrap { width: 100%; max-width: 1280px; display: grid; gap: 12px; }
  .top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
  .name { font-family: var(--display); font-size: 28px; letter-spacing: 0.02em; text-transform: uppercase; margin: 0; line-height: 1; }
  .name em { font-family: var(--serif); font-style: italic; color: var(--accent); font-size: 1.15em; }
  .meta { color: var(--dim); font-size: 13px; margin: 0; }
  .stage-wrap {
    position: relative; width: 100%; display: flex; align-items: center; justify-content: center;
    background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--line);
    max-height: 72vh;
  }
  .stage-wrap.mode-16by9 { aspect-ratio: 16 / 9; }
  .stage-wrap.mode-9by16 { aspect-ratio: 9 / 16; max-height: 75vh; }
  canvas { width: 100%; height: 100%; display: block; object-fit: contain; }
  .bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px;
  }
  button, select {
    font: 600 13px var(--body); color: var(--ink); background: transparent; border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  button:hover, select:hover { border-color: var(--dim); }
  button[aria-pressed="true"] { background: var(--accent); color: #09090b; border-color: var(--accent); }
  #play { min-width: 78px; justify-content: center; background: var(--ink); color: #09090b; border-color: var(--ink); font-weight: 700; }
  #scrub { flex: 1 1 200px; min-width: 0; accent-color: var(--accent); cursor: pointer; }
  #time { font: 600 13px var(--body); font-variant-numeric: tabular-nums; color: var(--dim); min-width: 90px; text-align: right; }
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <h1 class="name">Code-Drawn <em>Motion</em> Graphics</h1>
    <p class="meta" id="status-meta">Interactive Player · Pure f(t) Canvas · Synthesized Web Audio SFX</p>
  </div>
  <div class="stage-wrap mode-16by9" id="stage-box">
    <canvas id="stage" width="1920" height="1080"></canvas>
  </div>
  <div class="bar">
    <button id="play" type="button">Play</button>
    <input id="scrub" type="range" min="0" max="30" step="0.01" value="0" aria-label="Scrub timeline">
    <span id="time">0.00 / 30.00</span>
    <button id="sound" type="button" aria-pressed="true">Sound on</button>
    <button id="loop" type="button" aria-pressed="true">Loop</button>
    <select id="aspect" aria-label="Aspect Ratio">
      <option value="16by9" selected>16:9 Landscape</option>
      <option value="9by16">9:16 Portrait</option>
    </select>
  </div>
</div>

<script>
// =====================================================================================================
// CODE-DRAWN MOTION GRAPHICS ENGINE & INTERACTIVE PLAYER
// Every frame is a pure mathematical function of time t. Seeded PRNG. Dual orientation.
// =====================================================================================================

// --- 1. CORE MATH & EASING HELPERS (CM) ---
const CM = (() => {
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const span = (t, a, b) => clamp((t - a) / (b - a));
  const rotl = (x, k) => (x << k) | (x >>> (32 - k));
  const hash = (s) => { s = String(s); let h = 0x9e3779b1; for (let i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 0x85ebca6b); h ^= h >>> 13; } return h >>> 0; };
  const rng = (seed) => {
    const s = typeof seed === 'number' ? seed >>> 0 : hash(seed);
    let a = (s ^ 0xa5a5a5a5) >>> 0, b = (Math.imul(s, 0x27d4eb2d) >>> 0) || 1, c = (0x165667b1 ^ s) >>> 0, d = (rotl(s, 7) >>> 0) || 7;
    const r = () => { const res = Math.imul(rotl(Math.imul(b, 5), 7), 9) >>> 0; const t = b << 9; c ^= a; d ^= b; b ^= c; a ^= d; c ^= t; d = rotl(d, 11); return res / 4294967296; };
    for (let i = 0; i < 8; i++) r();
    r.in = (lo, hi) => lo + r() * (hi - lo);
    r.pick = (arr) => arr[(r() * arr.length) | 0];
    return r;
  };
  const noise1 = (seed) => { const r = rng(seed), v = Float32Array.from({ length: 256 }, () => r() * 2 - 1); return (x) => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(v[i & 255], v[(i + 1) & 255], u); }; };
  const ez = {
    out3: (u) => 1 - Math.pow(1 - u, 3),
    in3: (u) => u * u * u,
    inout3: (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2),
    outExpo: (u) => (u >= 1 ? 1 : 1 - Math.pow(2, -10 * u)),
    back: (u, s = 1.7) => (u <= 0 ? 0 : u >= 1 ? 1 : 1 + (s + 1) * Math.pow(u - 1, 3) + s * Math.pow(u - 1, 2)),
    spring: (u) => (u <= 0 ? 0 : u >= 1 ? 1 : 1 - Math.exp(-6 * u) * Math.cos(13 * u)),
  };
  const layer = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  return { clamp, lerp, span, hash, rng, noise1, ez, layer };
})();

// --- 2. PROCEDURAL WEB AUDIO SFX SYNTHESIZER KIT (SFX) ---
const SFX = (() => {
  const SEMI = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 };
  const hz = (n) => { if (typeof n === 'number') return n; const m = /^([A-G])(#|b)?(-?\d)$/.exec(n); return 440 * Math.pow(2, (SEMI[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (+m[3] - 4) * 12) / 12); };

  function kit(ac, o = {}) {
    const VO = !!o.voiceover, SR = ac.sampleRate, T0 = o.from || 0, base = ac.currentTime + (o.lead || 0);
    const at = (t) => (Math.round((base + (t - T0)) * SR) + 0.3) / SR;
    const skip = (t, dur) => at(t) + dur < ac.currentTime || (t < T0 - 0.005 && dur < 1.2);

    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 6; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.15;
    const master = ac.createGain(); master.gain.value = o.master == null ? 0.85 : o.master;
    comp.connect(master); master.connect(o.dest || ac.destination);
    const mk = (g) => { const n = ac.createGain(); n.gain.value = g; n.connect(comp); return n; };
    const bus = { fx: mk(VO ? 0.75 : 0.95), music: mk(VO ? 0.10 : 0.60), amb: mk(0.40) };
    const duckIn = ac.createGain(); duckIn.connect(bus.music);
    const DUCKS = [];

    const verb = ac.createConvolver();
    { const n = Math.floor(1.5 * SR), ir = ac.createBuffer(2, n, SR);
      for (let ch = 0; ch < 2; ch++) { const r = CM.rng('plate' + ch), d = ir.getChannelData(ch); let lp = 0; for (let i = 0; i < n; i++) { const u = i / n; lp += (0.7 - 0.5 * u) * ((r() * 2 - 1) - lp); d[i] = lp * Math.pow(1 - u, 2.6) * 0.9; } }
      verb.buffer = ir; }
    const verbIn = ac.createGain(); verbIn.gain.value = 0.8; verbIn.connect(verb); verb.connect(comp);

    const NB = {};
    { const n = Math.floor(2 * SR);
      for (const kind of ['white', 'pink', 'brown']) {
        const b = ac.createBuffer(1, n, SR), d = b.getChannelData(0), r = CM.rng('nz' + kind); let b0 = 0, b1 = 0, b2 = 0, br = 0;
        for (let i = 0; i < n; i++) { const w = r() * 2 - 1;
          if (kind === 'white') d[i] = w;
          else if (kind === 'pink') { b0 = 0.99765 * b0 + w * 0.099; b1 = 0.963 * b1 + w * 0.2965; b2 = 0.57 * b2 + w * 1.0527; d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.18; }
          else { br = (br + 0.02 * w) / 1.02; d[i] = br * 3.4; } }
        NB[kind] = b; } }

    const ramp = (param, v, t) => { if (!Array.isArray(v)) { param.setValueAtTime(v, t); return; } param.setValueAtTime(v[0][1], t + v[0][0]); for (let i = 1; i < v.length; i++) param.exponentialRampToValueAtTime(Math.max(1e-3, v[i][1]), t + v[i][0]); };
    const env = (g, t, peak, dur, a = 0.004, hold = 0) => {
      a = Math.min(a, dur * 0.9); hold = Math.min(hold, dur - a);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + a);
      if (hold > 0) g.gain.setValueAtTime(peak, t + a + hold);
      g.gain.exponentialRampToValueAtTime(1e-4, t + dur); g.gain.setValueAtTime(0, t + dur + 0.002);
    };
    const level = (p, d) => (p.gain == null ? d : p.gain) * (VO && p.soft ? 0.55 : 1);
    const route = (node, p, t) => {
      const pan = ac.createStereoPanner();
      if (Array.isArray(p.pan)) { pan.pan.setValueAtTime(p.pan[0], t); pan.pan.linearRampToValueAtTime(p.pan[1], t + (p.dur || 0.2)); } else pan.pan.value = CM.clamp(p.pan || 0, -1, 1);
      node.connect(pan); pan.connect(p.bus === 'music' ? duckIn : bus[p.bus || 'fx']);
      if (p.verb) { const s = ac.createGain(); s.gain.value = p.verb; pan.connect(s); s.connect(verbIn); }
    };
    const filt = (p, t) => { if (!p.filter) return null; const f = ac.createBiquadFilter(); f.type = p.filter; f.Q.value = p.q == null ? 0.9 : p.q; ramp(f.frequency, p.ff == null ? 1200 : p.ff, t); return f; };

    function voice(time, p) {
      const dur = p.dur || 0.2; if (skip(time, dur)) return; const t = at(time);
      const osc = ac.createOscillator(); osc.type = p.type || 'sine';
      ramp(osc.frequency, Array.isArray(p.f) ? p.f.map(([d, v]) => [d, hz(v)]) : hz(p.f || 440), t);
      const g = ac.createGain(); env(g, t, level(p, 0.3), dur, p.a, p.hold);
      const f = filt(p, t); if (f) { osc.connect(f); f.connect(g); } else osc.connect(g);
      route(g, p, t); osc.start(t); osc.stop(t + dur + 0.03);
    }
    function hiss(time, p) {
      const dur = p.dur || 0.2; if (skip(time, dur)) return; const t = at(time);
      const src = ac.createBufferSource(); src.buffer = NB[p.color || 'white']; src.loop = true; if (p.rate) src.playbackRate.value = p.rate;
      const g = ac.createGain(); env(g, t, level(p, 0.3), dur, p.a, p.hold);
      const f = filt(p, t); if (f) { src.connect(f); f.connect(g); } else src.connect(g);
      route(g, p, t); src.start(t, CM.rng('off' + time)() * 1.5); src.stop(t + dur + 0.03);
    }
    function duck(t, depth = 0.5, hold = 0.25) { DUCKS.push({ t, depth, hold }); }

    const S = {
      slam: (t, o) => { voice(t, { f: [[0, 150], [0.12, 52]], dur: 0.2, gain: 0.42 * o.g, pan: o.pan, soft: o.soft }); hiss(t, { dur: 0.07, filter: 'lowpass', ff: 2600, gain: 0.22 * o.g, pan: o.pan, soft: o.soft }); hiss(t, { dur: 0.012, filter: 'highpass', ff: 5000, gain: 0.12 * o.g, pan: o.pan, soft: o.soft }); },
      boom: (t, o) => { voice(t, { f: [[0, 90], [0.08, 52], [1.6, 34]], dur: 1.7, gain: 0.7 * o.g, a: 0.006, hold: 0.12 }); hiss(t, { color: 'brown', dur: 0.6, filter: 'lowpass', ff: [[0, 600], [0.5, 90]], gain: 0.35 * o.g, verb: 0.3 }); duck(t, 0.7, 0.35); },
      pop: (t, o) => { const f = o.f || 760; voice(t, { f: [[0, f * 1.7], [0.05, f]], dur: 0.08, gain: 0.22 * o.g, pan: o.pan, soft: o.soft }); hiss(t, { dur: 0.01, filter: 'highpass', ff: 4500, gain: 0.08 * o.g, pan: o.pan, soft: o.soft }); },
      tick: (t, o) => hiss(t, { dur: 0.016, filter: 'bandpass', ff: o.f || 3800, q: 3, gain: 0.32 * o.g, pan: o.pan, soft: o.soft }),
      click: (t, o) => { hiss(t, { dur: 0.012, filter: 'bandpass', ff: 3200, q: 2, gain: 0.35 * o.g, pan: o.pan }); hiss(t + 0.045, { dur: 0.01, filter: 'bandpass', ff: 2400, q: 2, gain: 0.22 * o.g, pan: o.pan }); },
      whoosh: (t, o) => { const d = o.dur || 0.35, dir = o.dir || 1; hiss(t, { color: 'pink', dur: d, filter: 'bandpass', ff: [[0, 260], [d * 0.55, o.top || 3200], [d, 520]], q: 0.75, gain: 0.5 * o.g, a: d * 0.55, pan: [-0.7 * dir, 0.7 * dir], verb: 0.12, soft: o.soft }); hiss(t + d * 0.2, { dur: d * 0.6, filter: 'highpass', ff: [[0, 3000], [d * 0.6, 7000]], gain: 0.08 * o.g, a: d * 0.3, pan: [-0.4 * dir, 0.5 * dir], soft: o.soft }); },
      riser: (t, o) => { const d = o.dur || 0.8; hiss(t, { color: 'pink', dur: d, filter: 'bandpass', ff: [[0, 300], [d, 5200]], q: 1.1, gain: 0.32 * o.g, a: d * 0.96, verb: 0.2, soft: o.soft }); voice(t, { type: 'sawtooth', f: [[0, 110], [d, 440]], dur: d, gain: 0.06 * o.g, a: d * 0.95, filter: 'lowpass', ff: [[0, 400], [d, 2400]], soft: o.soft }); },
      glitch: (t, o) => { const r = CM.rng('gl' + t); for (let i = 0; i < 9; i++) voice(t + i * 0.021, { type: 'square', f: 180 + r() * 2200, dur: 0.018, gain: 0.07 * o.g, a: 0.001, hold: 0.012, pan: r() * 1.4 - 0.7 }); hiss(t, { dur: 0.2, filter: 'bandpass', ff: [[0, 4000], [0.2, 900]], q: 0.7, gain: 0.18 * o.g }); hiss(t + 0.1, { dur: 0.05, color: 'brown', gain: 0.25 * o.g }); },
      ping: (t, o) => { voice(t, { f: 'E6', dur: 0.5, gain: 0.16 * o.g, a: 0.003, verb: 0.3, pan: o.pan }); voice(t + 0.11, { f: 'B6', dur: 0.7, gain: 0.14 * o.g, a: 0.003, verb: 0.35, pan: o.pan }); },
      send: (t, o) => { voice(t, { f: [[0, 520], [0.11, 1500]], dur: 0.13, gain: 0.14 * o.g, pan: o.pan }); hiss(t, { dur: 0.1, filter: 'highpass', ff: [[0, 2000], [0.1, 6000]], gain: 0.07 * o.g, pan: o.pan }); },
      keys: (t, o) => { const r = CM.rng('k' + t), end = t + (o.dur || 0.4); for (let x = t; x < end; x += 0.055 + r() * 0.035) { hiss(x, { dur: 0.014, filter: 'bandpass', ff: 3200 + r() * 900, q: 3, gain: 0.2 * o.g, pan: o.pan, soft: true }); voice(x, { f: 1900 + r() * 300, dur: 0.012, gain: 0.025 * o.g, pan: o.pan, soft: true }); } },
      marker: (t, o) => { const d = o.dur || 0.25, r = CM.rng('m' + t); for (let x = 0; x < d; x += 0.022 + r() * 0.012) hiss(t + x, { dur: 0.03, filter: 'bandpass', ff: 1700 + r() * 900, q: 1.4, gain: 0.16 * o.g * (0.6 + r() * 0.5), pan: o.pan, soft: o.soft }); },
      strike: (t, o) => { hiss(t, { dur: 0.15, filter: 'bandpass', ff: [[0, 1200], [0.15, 3200]], q: 1.2, gain: 0.3 * o.g, a: 0.02, pan: o.pan }); },
      tapeStop: (t, o) => { voice(t, { type: 'sawtooth', f: [[0, 196], [0.62, 18]], dur: 0.66, gain: 0.22 * o.g, a: 0.004, hold: 0.3, filter: 'lowpass', ff: [[0, 1800], [0.6, 160]] }); voice(t, { f: [[0, 98], [0.62, 12]], dur: 0.66, gain: 0.3 * o.g, a: 0.004, hold: 0.3 }); hiss(t, { color: 'brown', dur: 0.5, filter: 'lowpass', ff: [[0, 900], [0.5, 120]], gain: 0.18 * o.g }); },
      stamp: (t, o) => { voice(t, { f: [[0, 160], [0.18, 48]], dur: 0.28, gain: 0.6 * o.g }); hiss(t, { dur: 0.06, filter: 'bandpass', ff: 1300, q: 1.1, gain: 0.4 * o.g }); hiss(t + 0.004, { dur: 0.014, filter: 'highpass', ff: 4200, gain: 0.25 * o.g }); },
      shimmer: (t, o) => { ['C6', 'E6', 'G6', 'B6', 'D7', 'E7'].forEach((n, i) => voice(t + i * 0.035, { f: n, dur: 0.75, gain: 0.045 * o.g, a: 0.003, verb: 0.45, pan: (i % 2 ? 0.35 : -0.35) })); },
      sparkle: (t, o) => { const r = CM.rng('sp' + t); for (let i = 0; i < 5; i++) voice(t + i * 0.05, { f: 2400 + r() * 2400, dur: 0.25, gain: 0.03 * o.g, a: 0.002, verb: 0.4, pan: r() * 1.2 - 0.6 }); },
    };
    function play(name, t, opts = {}) { const fn = S[name]; if (!fn) throw new Error('unknown sound ' + name); fn(t, Object.assign({}, opts, { g: opts.gain == null ? 1 : opts.gain })); }
    function finish() {
      DUCKS.sort((a, b) => a.t - b.t);
      for (const e of DUCKS) { const s = at(e.t); if (s + e.hold < ac.currentTime) continue; duckIn.gain.setTargetAtTime(1 - e.depth, Math.max(s, ac.currentTime), 0.008); duckIn.gain.setTargetAtTime(1, s + e.hold, 0.14); }
    }
    return { play, voice, hiss, finish, hz, vo: VO };
  }
  function live(score, from, opts = {}) {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const k = kit(ac, Object.assign({}, opts, { from: from || 0, lead: 0.04 })); score(k); k.finish();
    return () => { try { ac.close(); } catch (e) {} };
  }
  async function render(score, dur, sr = 48000, opts = {}) {
    const len = Math.ceil(dur * sr), ac = new OfflineAudioContext(2, len, sr);
    const k = kit(ac, Object.assign({}, opts, { from: 0 })); score(k); k.finish();
    const buf = await ac.startRendering(), L = buf.getChannelData(0), R = buf.getChannelData(1), inter = new Float32Array(len * 2);
    let peak = 0; for (let i = 0; i < len; i++) { inter[2 * i] = L[i]; inter[2 * i + 1] = R[i]; peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i])); }
    return { inter, peak, sr, frames: len };
  }
  return { kit, live, render, hz };
})();

// --- 3. DUAL-ORIENTATION CANVAS ENGINE ---
const Orientation = {
  LANDSCAPE: { W: 1920, H: 1080, name: '16by9' },
  PORTRAIT: { W: 1080, H: 1920, name: '9by16' }
};

let currentMode = Orientation.LANDSCAPE;
let W = currentMode.W, H = currentMode.H;

function setOrientation(mode) {
  currentMode = mode; W = mode.W; H = mode.H;
  const cvs = document.getElementById('stage');
  const box = document.getElementById('stage-box');
  cvs.width = W; cvs.height = H;
  box.className = 'stage-wrap mode-' + mode.name;
}

// --- 4. DESIGN TOKENS ---
const C = {
  bg: '#09090b',
  panel: '#141417',
  line: '#27272a',
  ink: '#f4f4f5',
  dim: '#a1a1aa',
  accent: '#ffd60a',
  blue: '#38bdf8',
  green: '#34d399',
  red: '#f87171'
};

const F = {
  disp: '"Anton", sans-serif',
  body: '"Inter", sans-serif',
  serif: '"Instrument Serif", serif',
  mono: '"JetBrains Mono", monospace'
};

const disp = (px) => `${px}px ${F.disp}`;
const inter = (px, w = 600) => `${w} ${px}px ${F.body}`;
const serif = (px) => `italic ${px}px ${F.serif}`;
const mono = (px, w = 500) => `${w} ${px}px ${F.mono}`;

// --- 5. PROCEDURAL 2D DRAWING PRIMITIVES & PROOF SHOTS ---
const { clamp, lerp, span, rng, noise1, ez } = CM;

const word = (s, t, font, color, extra) => Object.assign({ s, t, font, color: color || C.ink }, extra || {});

function measure(c, it) { c.font = it.font; c.letterSpacing = it.track || '0px'; const w = c.measureText(it.s).width; c.letterSpacing = '0px'; return w; }

function row(c, items, x, y, gap, align = 'center') {
  let tot = 0; items.forEach((it) => { it.w = measure(c, it); tot += it.w; }); tot += gap * (items.length - 1);
  let cx = align === 'center' ? x - tot / 2 : x;
  items.forEach((it) => { it.x = cx; it.cx = cx + it.w / 2; it.y = y; cx += it.w + gap; });
  return { x0: align === 'center' ? x - tot / 2 : x, w: tot };
}

function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }

function slam(c, it, t, o = {}) {
  if (t < it.t) return;
  const u = span(t, it.t, it.t + (o.dur || 0.22)), e = ez.outExpo(u), s = lerp(o.from || 1.45, 1, e);
  c.save(); c.translate(it.cx, it.y); c.scale(s, s);
  c.globalAlpha = (o.alpha == null ? 1 : o.alpha) * Math.min(1, u * 3.5);
  if (u < 1 && !o.noBlur) { const b = (1 - e) * 10; if (b > 0.5) c.filter = `blur(${b.toFixed(1)}px)`; }
  c.font = it.font; c.letterSpacing = it.track || '0px'; c.textAlign = 'center'; c.textBaseline = it.base || 'middle';
  if (o.glow) { c.shadowColor = o.glow; c.shadowBlur = o.glowBlur || 35; }
  c.fillStyle = o.color || it.color; c.fillText(it.s, 0, 0);
  c.restore();
}

function swipe(c, it, t, t0, dur, o = {}) {
  const p = ez.out3(span(t, t0, t0 + dur)); if (p <= 0) return null;
  const px = parseFloat(/(\d+)px/.exec(it.font)[1]), h = (o.h || 0.8) * px, pad = o.pad || 20, y = it.y + (o.dy || 0) - h / 2;
  const x = it.x - pad, w = (it.w + pad * 2) * p, r = rng('sw' + t0);
  const path = new Path2D();
  path.moveTo(x + r.in(0, 6), y + r.in(0, 5)); path.lineTo(x + w, y + r.in(-4, 2));
  path.lineTo(x + w + r.in(-5, 3), y + h + r.in(-2, 4)); path.lineTo(x + r.in(2, 8), y + h + r.in(-3, 2)); path.closePath();
  c.save(); c.fillStyle = o.color || C.accent; c.fill(path); c.restore();
  return path;
}

function slamMarked(c, it, t, path, o = {}) {
  slam(c, it, t, o);
  if (!path) return;
  c.save(); c.clip(path); slam(c, it, t, Object.assign({}, o, { color: '#09090b', glow: null })); c.restore();
}

function strike(c, x0, x1, y, p, col = C.red, w = 14, tilt = -0.02) {
  if (p <= 0) return; const e = ez.out3(clamp(p)), x = lerp(x0, x1, e);
  c.save(); c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; c.shadowColor = col; c.shadowBlur = 14;
  c.beginPath(); c.moveTo(x0, y); c.lineTo(x, y + (x - x0) * tilt); c.stroke(); c.restore();
}

function scribble(c, cx, cy, rx, ry, p, col, w, seed) {
  if (p <= 0) return; const n = noise1(seed), N = 96, turns = 1.15, a0 = -2.4, m = Math.max(2, Math.ceil(N * clamp(p)));
  c.save(); c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath();
  for (let i = 0; i <= m; i++) { const u = i / N, a = a0 + u * turns * Math.PI * 2, k = 1 + 0.08 * n(u * 5 + seed) + 0.04 * u; const x = cx + Math.cos(a) * rx * k, y = cy + Math.sin(a) * ry * k; i ? c.lineTo(x, y) : c.moveTo(x, y); }
  c.stroke(); c.restore();
}

function handArrow(c, p0, q, p1, p, col, w) {
  if (p <= 0) return; const N = 32, m = Math.max(2, Math.round(N * clamp(p))), pts = [];
  for (let i = 0; i <= m; i++) { const u = i / N, v = 1 - u; pts.push([v * v * p0[0] + 2 * v * u * q[0] + u * u * p1[0], v * v * p0[1] + 2 * v * u * q[1] + u * u * p1[1]]); }
  c.save(); c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath(); pts.forEach((q2, i) => (i ? c.lineTo(q2[0], q2[1]) : c.moveTo(q2[0], q2[1]))); c.stroke();
  if (p >= 0.90) { const a = pts[pts.length - 1], b = pts[pts.length - 4], an = Math.atan2(a[1] - b[1], a[0] - b[0]), hl = 26;
    c.beginPath(); c.moveTo(a[0] - Math.cos(an - 0.55) * hl, a[1] - Math.sin(an - 0.55) * hl); c.lineTo(a[0], a[1]); c.lineTo(a[0] - Math.cos(an + 0.55) * hl, a[1] - Math.sin(an + 0.55) * hl); c.stroke(); }
  c.restore();
}

// 3D Perspective Tilt via Vertical Slice Projection (Proof Shot Mockup)
function drawYaw(c, src, cx, cy, w, h, yaw, alpha) {
  const f = 1600, cs = Math.cos(yaw), sn = Math.sin(yaw);
  const proj = (x) => { const X = x * cs, Z = x * sn, k = f / (f + Z); return { x: cx + X * k, k }; };
  const L = proj(-w / 2), R = proj(w / 2);
  c.save(); c.globalAlpha = alpha;
  c.save(); c.filter = 'blur(36px)'; c.fillStyle = 'rgba(0,0,0,0.75)'; c.beginPath();
  c.moveTo(L.x + 20, cy - (h * L.k) / 2 + 50); c.lineTo(R.x + 20, cy - (h * R.k) / 2 + 50); c.lineTo(R.x + 20, cy + (h * R.k) / 2 + 50); c.lineTo(L.x + 20, cy + (h * L.k) / 2 + 50); c.closePath(); c.fill(); c.restore();
  const sw = 4;
  for (let sx = 0; sx < src.width; sx += sw) {
    const p0 = proj((sx / src.width - 0.5) * w), p1 = proj(((sx + sw) / src.width - 0.5) * w), hh = (h * (p0.k + p1.k)) / 2;
    c.drawImage(src, sx, 0, sw, src.height, p0.x, cy - hh / 2, p1.x - p0.x + 0.8, hh);
  }
  const g = c.createLinearGradient(L.x, cy - h / 2, R.x, cy + h / 2); g.addColorStop(0, 'rgba(255,255,255,0.12)'); g.addColorStop(0.4, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(0,0,0,0.15)');
  c.fillStyle = g; c.beginPath(); c.moveTo(L.x, cy - (h * L.k) / 2); c.lineTo(R.x, cy - (h * R.k) / 2); c.lineTo(R.x, cy + (h * R.k) / 2); c.lineTo(L.x, cy + (h * L.k) / 2); c.closePath(); c.fill();
  c.restore();
}

// Procedural Proof Shot: Code-Drawn Terminal Window
function drawTerminalProof(c, x, y, w, h, title, command, outputText, p) {
  c.save(); c.translate(x, y);
  c.fillStyle = '#0f0f13'; rr(c, 0, 0, w, h, 14); c.fill();
  c.strokeStyle = '#27272a'; c.lineWidth = 1.5; rr(c, 0, 0, w, h, 14); c.stroke();
  // Chrome bar
  c.fillStyle = '#18181b'; rr(c, 0, 0, w, 40, [14, 14, 0, 0]); c.fill();
  [['#ff5f57', 24], ['#febc2e', 44], ['#28c840', 64]].forEach(([col, cx]) => {
    c.fillStyle = col; c.beginPath(); c.arc(cx, 20, 6, 0, 7); c.fill();
  });
  c.fillStyle = '#71717a'; c.font = mono(14, 500); c.textAlign = 'center'; c.fillText(title, w / 2, 25);
  // Code execution
  c.textAlign = 'left'; c.font = mono(18, 500); c.fillStyle = '#38bdf8';
  c.fillText('❯', 24, 78);
  const cmdLen = Math.floor(command.length * clamp(p * 2));
  c.fillStyle = '#f4f4f5'; c.fillText(command.slice(0, cmdLen), 46, 78);
  if (p < 0.6) {
    c.fillStyle = '#ffd60a'; c.fillText('_', 46 + c.measureText(command.slice(0, cmdLen)).width + 2, 78);
  } else if (p >= 0.65) {
    c.fillStyle = '#34d399'; c.font = mono(16, 400);
    const outLines = outputText.split('\n');
    outLines.forEach((line, idx) => {
      c.fillText(line, 24, 114 + idx * 26);
    });
  }
  c.restore();
}

  x.fillStyle = '#ffffff'; rr(x, 120, 12, 420, 28, 14); x.fill(); x.fillStyle = '#6d6a64'; x.font = inter(16, 600); x.textBaseline = 'middle'; x.fillText('cloud.system.dev/architecture', 140, 27);
  x.fillStyle = '#121214'; x.font = disp(52); x.textBaseline = 'alphabetic'; x.fillText('SYSTEM NODES', 40, 130);

// --- 6. BACKGROUND, CAMERA & FINISHING ---
function background(c, t) {
  c.fillStyle = C.bg; c.fillRect(0, 0, W, H);
  const glow = (x, y, r, col) => { const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(0, 0, W, H); };
  glow(W * 0.2 + Math.sin(t * 0.35) * 80, H * 0.25 + Math.cos(t * 0.27) * 50, W * 0.45, 'rgba(56,189,248,0.06)');
  glow(W * 0.8 + Math.cos(t * 0.31) * 70, H * 0.75 + Math.sin(t * 0.22) * 60, W * 0.50, 'rgba(255,214,10,0.05)');
  c.save(); c.strokeStyle = 'rgba(244,244,245,0.028)'; c.lineWidth = 1; c.beginPath();
  const off = (t * 10) % 90; for (let x = -off; x < W; x += 90) { c.moveTo(x, 0); c.lineTo(x, H); } for (let y = -off * 0.5; y < H; y += 90) { c.moveTo(0, y); c.lineTo(W, y); } c.stroke(); c.restore();
}

const NX = noise1(17), NY = noise1(29), NR = noise1(43);
function camera(t, si, PUNCH = [], SHAKE = [], PUSH = []) {
  let z = 1, dx = 0, dy = 0, rot = 0;
  if (PUSH[si]) { const [a, b] = PUSH[si]; z *= 1 + 0.035 * ez.inout3(span(t, a, b)); }
  for (const k of PUNCH) { const d = t - k.t; if (d < 0) continue; const e = d < 0.06 ? ez.out3(d / 0.06) : Math.exp(-(d - 0.06) * (k.k || 2.6)); z += k.a * e; }
  for (const k of SHAKE) { const d = t - k.t; if (d < 0 || d > 1.4) continue; const e = k.a * Math.exp(-d * (k.k || 8)); dx += e * NX(t * 34 + k.t * 5); dy += e * NY(t * 37 + k.t * 3); rot += e * 0.0015 * NR(t * 26 + k.t); }
  return { z, dx, dy, rot, fx: W / 2, fy: H / 2 };
}
const applyCam = (c, k) => { c.translate(W / 2 + k.dx, H / 2 + k.dy); c.rotate(k.rot); c.scale(k.z, k.z); c.translate(-k.fx, -k.fy); };

let GRAIN = null;
function grainTiles() { if (GRAIN) return GRAIN; GRAIN = []; for (let g = 0; g < 4; g++) { const L = CM.layer(256, 256), x = L.getContext('2d'), img = x.createImageData(256, 256), r = rng('grain' + g); for (let i = 0; i < img.data.length; i += 4) { const v = 128 + (r() + r() - 1) * 120; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; } x.putImageData(img, 0, 0); GRAIN.push(L); } return GRAIN; }

function finishing(c, t, LEAK = [], FLASH = []) {
  for (const t0 of LEAK) { const u = span(t, t0, t0 + 0.95); if (u <= 0 || u >= 1) continue; const e = Math.sin(Math.PI * u);
    c.save(); c.globalCompositeOperation = 'screen'; const x = lerp(-200, W + 200, ez.out3(u)), g = c.createRadialGradient(x, 150, 0, x, 150, W * 0.55);
    g.addColorStop(0, `rgba(255,160,60,${0.40 * e})`); g.addColorStop(0.5, `rgba(255,80,50,${0.15 * e})`); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(0, 0, W, H); c.restore(); }
  for (const f of FLASH) { const d = t - f.t; if (d < 0 || d > 0.4 || !f.a) continue; c.fillStyle = `rgba(${f.col || '255,255,255'},${f.a * Math.exp(-d * 11)})`; c.fillRect(0, 0, W, H); }
  const v = c.createRadialGradient(W / 2, H / 2, W * 0.22, W / 2, H / 2, W * 0.65); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.60)'); c.fillStyle = v; c.fillRect(0, 0, W, H);
  const fi = Math.floor(t * 24), r = rng(fi + 900), tile = grainTiles()[fi % 4];
  c.save(); c.globalAlpha = 0.065; c.globalCompositeOperation = 'overlay'; const pat = c.createPattern(tile, 'repeat'); pat.setTransform(new DOMMatrix().translateSelf(-r() * 256, -r() * 256)); c.fillStyle = pat; c.fillRect(0, 0, W, H);
  c.globalAlpha = 0.03; c.globalCompositeOperation = 'source-over'; c.fillRect(0, 0, W, H); c.restore();
}

function topProgressBar(c, t, duration) {
  const p = clamp(t / duration);
  c.save();
  const g = c.createLinearGradient(0, 0, W * p, 0);
  g.addColorStop(0, C.blue); g.addColorStop(1, C.accent);
  c.fillStyle = g;
  c.fillRect(0, 0, W * p, currentMode === Orientation.LANDSCAPE ? 6 : 8);
  c.restore();
}

// --- 7. DEMO SCENES & COMPOSITOR ---
const DURATION = 24.0;
const TL = {
  s1: { w1: [0.2, 0.45], w2: [0.8, 1.1], hl: 1.4, yaw: 1.5 },
  s2: { w: [6.2, 6.4, 6.6], term: 6.8, strike: 9.2 },
  s3: { w: [12.2, 12.5], cnt: [13.0, 15.5], lock: 15.5 },
  s4: { w: [18.2, 18.5, 18.8], take: 20.0 }
};

const PUNCH = [{ t: 1.1, a: 0.08 }, { t: 9.2, a: 0.09 }, { t: 15.5, a: 0.12 }, { t: 20.0, a: 0.08 }];
const SHAKE = [{ t: 1.1, a: 10 }, { t: 9.2, a: 14 }, { t: 15.5, a: 18 }];
const FLASH = [{ t: 6.0, a: 0.4 }, { t: 12.0, a: 0.5 }, { t: 15.5, a: 0.6 }];
const LEAK = [1.1, 15.5];
const PUSH = [[0, 6.0], [6.0, 12.0], [12.0, 18.0], [18.0, 24.0]];

function renderScene(ctx, t) {
  const isLandscape = currentMode === Orientation.LANDSCAPE;
  if (t < 6.0) {
    // Scene 1: Hook & 3D Perspective Browser Proof Shot
    const r1 = [word('STOP', TL.s1.w1[0], disp(isLandscape ? 120 : 96), C.ink), word('BUILDING', TL.s1.w1[1], disp(isLandscape ? 120 : 96), C.ink)];
    const r2 = [word('BRITTLE', TL.s1.w2[0], disp(isLandscape ? 150 : 110), C.accent), word('SYSTEMS.', TL.s1.w2[1], disp(isLandscape ? 150 : 110), C.ink)];
    row(ctx, r1, isLandscape ? W * 0.32 : W * 0.5, isLandscape ? 240 : 280, 24);
    row(ctx, r2, isLandscape ? W * 0.32 : W * 0.5, isLandscape ? 390 : 410, 26);
    [...r1, ...r2].forEach((it) => slam(ctx, it, t));
    const path = swipe(ctx, r2[0], t, TL.s1.hl, 0.25);
    slamMarked(ctx, r2[0], t, path);
    // Proof shot: 3D browser layer rotated in yaw
    if (t > TL.s1.yaw) {
      const enter = ez.outExpo(span(t, TL.s1.yaw, TL.s1.yaw + 0.6));
      if (isLandscape) {
        drawYaw(ctx, drawBrowserProof(t - TL.s1.yaw), 1360 + (1 - enter) * 400, 560, 680, 440, -0.42, enter);
      } else {
        drawYaw(ctx, drawBrowserProof(t - TL.s1.yaw), W / 2, 880 + (1 - enter) * 300, 680, 440, -0.25, enter);
      }
    }
  } else if (t < 12.0) {
    // Scene 2: Live Code & Terminal Proof Shot with Strike
    const h = [word('EXECUTING', TL.s2.w[0], disp(isLandscape ? 110 : 86)), word('WITHOUT', TL.s2.w[1], disp(isLandscape ? 110 : 86)), word('RETRIES?', TL.s2.w[2], disp(isLandscape ? 110 : 86), C.red)];
    row(ctx, h, W / 2, isLandscape ? 220 : 260, 22);
    h.forEach((it) => slam(ctx, it, t));
    strike(ctx, W * 0.2, W * 0.8, isLandscape ? 220 : 260, span(t, TL.s2.strike, TL.s2.strike + 0.2), C.red, 16);
    // Terminal window proof shot
    const tw = isLandscape ? 960 : W * 0.88, th = isLandscape ? 480 : 640;
    const tx = (W - tw) / 2, ty = isLandscape ? 360 : 420;
    drawTerminalProof(ctx, tx, ty, tw, th, 'deploy_agent.sh', 'curl -X POST https://api.prod/swarm/execute', 'STATUS: 504 GATEWAY TIMEOUT\nERR: Connection pool exhausted (0 retries remaining)\nFAIL: Pipeline failed at node #4', span(t, TL.s2.term, TL.s2.term + 3.0));
  } else if (t < 18.0) {
    // Scene 3: High-Speed Benchmark Math & Green Lock
    const r = [word('PIPELINE', TL.s3.w[0], disp(isLandscape ? 115 : 90)), word('RELIABILITY', TL.s3.w[1], disp(isLandscape ? 115 : 90), C.accent)];
    row(ctx, r, W / 2, isLandscape ? 240 : 280, 24);
    r.forEach((it) => slam(ctx, it, t));
    const cntProgress = ez.out3(span(t, TL.s3.cnt[0], TL.s3.cnt[1]));
    const val = (cntProgress * 99.9).toFixed(1) + '%';
    ctx.save(); ctx.translate(W / 2, isLandscape ? 560 : 700);
    ctx.font = disp(isLandscape ? 240 : 180); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = C.green;
    if (t > TL.s3.lock) { ctx.shadowColor = 'rgba(52,211,153,0.6)'; ctx.shadowBlur = 60; }
    ctx.fillText(val, 0, 0);
    ctx.restore();
    if (t > TL.s3.lock) {
      scribble(ctx, W / 2, isLandscape ? 560 : 700, isLandscape ? 420 : 320, isLandscape ? 180 : 130, span(t, TL.s3.lock, TL.s3.lock + 0.35), C.accent, 8, 12);
    }
  } else {
    // Scene 4: Actionable Takeaway
    const t1 = [word('ARCHITECT', TL.s4.w[0], disp(isLandscape ? 130 : 100)), word('FOR', TL.s4.w[1], disp(isLandscape ? 130 : 100)), word('SCALE.', TL.s4.w[2], disp(isLandscape ? 130 : 100), C.accent)];
    row(ctx, t1, W / 2, isLandscape ? 380 : 500, 26);
    t1.forEach((it) => slam(ctx, it, t));
    if (t > TL.s4.take) {
      const u = ez.out3(span(t, TL.s4.take, TL.s4.take + 0.4));
      ctx.save(); ctx.globalAlpha = u;
      ctx.font = inter(isLandscape ? 38 : 32, 600); ctx.fillStyle = C.dim; ctx.textAlign = 'center';
      ctx.fillText('Follow @devengoratela for production AI architectures', W / 2, isLandscape ? 560 : 700);
      ctx.restore();
    }
  }
}

// --- 8. COMPOSITOR & TIMELINE SEEK ---
const cvs = document.getElementById('stage');
const ctx = cvs.getContext('2d');

function explainer(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  background(ctx, t);
  const si = t < 6.0 ? 0 : t < 12.0 ? 1 : t < 18.0 ? 2 : 3;
  ctx.save();
  applyCam(ctx, camera(t, si, PUNCH, SHAKE, PUSH));
  renderScene(ctx, t);
  ctx.restore();
  topProgressBar(ctx, t, DURATION);
  finishing(ctx, t, LEAK, FLASH);
}

window.seek = (t) => explainer(clamp(t, 0, DURATION));
window.DURATION = DURATION;
window.scoreSound = scoreSound;
window.SFX = SFX;
window.setOrientation = setOrientation;
window.Orientation = Orientation;

// --- 9. INTERACTIVE TRANSPORT CONTROLS ---
const ui = {
  play: document.getElementById('play'),
  scrub: document.getElementById('scrub'),
  time: document.getElementById('time'),
  sound: document.getElementById('sound'),
  loop: document.getElementById('loop'),
  aspect: document.getElementById('aspect'),
  status: document.getElementById('status-meta')
};

let T = 0, playing = false, last = 0, soundOn = true, loopOn = true, stopSound = null;
const fmt = (t) => t.toFixed(2) + ' / ' + DURATION.toFixed(2);

function draw() {
  window.seek(T);
  ui.scrub.value = T;
  ui.time.textContent = fmt(T);
}

function startAudio() {
  stopAudio();
  if (!playing || !soundOn) return;
  stopSound = SFX.live(scoreSound, T, { voiceover: false });
}

function stopAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
}

function setPlaying(p) {
  playing = p;
  ui.play.textContent = p ? 'Pause' : 'Play';
  last = performance.now();
  if (p) startAudio(); else stopAudio();
}

function tick(now) {
  if (playing) {
    T += (now - last) / 1000;
    last = now;
    if (T >= DURATION) {
      if (loopOn) { T = 0; startAudio(); } else { T = DURATION; setPlaying(false); }
    }
    draw();
  }
  requestAnimationFrame(tick);
}

ui.play.addEventListener('click', () => {
  if (!playing && T >= DURATION) T = 0;
  setPlaying(!playing);
});
ui.scrub.addEventListener('input', () => {
  T = parseFloat(ui.scrub.value);
  draw();
  if (playing) startAudio();
});
ui.sound.addEventListener('click', () => {
  soundOn = !soundOn;
  ui.sound.setAttribute('aria-pressed', soundOn);
  ui.sound.textContent = soundOn ? 'Sound on' : 'Sound off';
  if (playing) startAudio();
});
ui.loop.addEventListener('click', () => {
  loopOn = !loopOn;
  ui.loop.setAttribute('aria-pressed', loopOn);
});
ui.aspect.addEventListener('change', () => {
  setOrientation(ui.aspect.value === '9by16' ? Orientation.PORTRAIT : Orientation.LANDSCAPE);
  draw();
});

(async () => {
  try {
    await Promise.all([
      '60px "Anton"', 'italic 60px "Instrument Serif"', '600 30px "Inter"', '700 30px "Inter"', '800 30px "Inter"'
    ].map((f) => document.fonts.load(f, 'AaZz09')));
    await document.fonts.ready;
  } catch (e) {}
  T = 0; draw();
  requestAnimationFrame((n) => { last = n; tick(n); });
})();
</script>
</body>
